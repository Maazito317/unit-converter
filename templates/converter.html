{# templates/converter.html #}
{% extends "base.html" %}

{% block content %}
<div class="converter-container">
  <!-- LEFT PANEL -->
  <div class="panel input-panel">
    <h2>{{ heading }}</h2>
    <form method="post">
      <label for="value">Value:</label>
      <input id="value" name="value" type="number" step="any" required
             value="{{ request.form.value or '' }}">

      <label for="from_unit">From:</label>
      <select id="from_unit" name="from_unit">
        {% for u in units %}
          <option value="{{ u }}"
            {% if request.form.from_unit == u %}selected{% endif %}>
            {{ u.title() }}
          </option>
        {% endfor %}
      </select>

      <label for="to_unit">To:</label>
      <select id="to_unit" name="to_unit">
        {% for u in units %}
          <option value="{{ u }}"
            {% if request.form.to_unit == u %}selected{% endif %}>
            {{ u.title() }}
          </option>
        {% endfor %}
      </select>

      <button type="submit" class="btn-convert">Convert</button>
    </form>
  </div>

  <!-- RIGHT PANEL -->
  <div class="panel result-panel">
    {% if result %}
      <h2>Result</h2>
      <p class="result-text">{{ result }}</p>
      <a href="{{ route_url }}" class="btn-reset">Reset</a>
    {% endif %}
  </div>
</div>
{% endblock %}
