{# templates/weight.html #}
{% extends "base.html" %}

{% block content %}
<div class="converter-container">
  <!-- LEFT PANEL: Input Form -->
  <div class="panel input-panel">
    <h2>Weight Converter</h2>
    <form method="post">
      <label for="value">Value:</label>
      <input id="value" name="value" type="number" step="any" required>

      <label for="from_unit">From:</label>
      <select id="from_unit" name="from_unit">
        {% for u in units %}
          <option value="{{ u }}">{{ u.title() }}</option>
        {% endfor %}
      </select>

      <label for="to_unit">To:</label>
      <select id="to_unit" name="to_unit">
        {% for u in units %}
          <option value="{{ u }}">{{ u.title() }}</option>
        {% endfor %}
      </select>

      <button type="submit" class="btn-convert">Convert</button>
    </form>
  </div>

  <!-- RIGHT PANEL: Result Display -->
  <div class="panel result-panel">
    {% if result %}
      <h2>Result</h2>
      <p class="result-text">{{ result }}</p>
      <a href="{{ url_for('weight') }}" class="btn-reset">Reset</a>
    {% endif %}
  </div>
</div>
{% endblock %}
